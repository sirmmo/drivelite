name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security** issue, please do not
        file it here — see [SECURITY.md](https://github.com/sirmmo/drivelite/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect instead?
      placeholder: Clicking a .webp thumbnail shows a broken image icon rather than the photo.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Mount a folder containing ...
        2. Open ...
        3. Click ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image tag, or commit SHA.
      placeholder: v0.1.0 / ghcr.io/sirmmo/drivelite:latest
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - Docker
        - docker compose
        - Local binary (go run / go build)
        - Kubernetes
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        Your DRIVELITE_* environment variables and mount flags.
        Redact passwords and session keys.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output from `docker logs <container>` around the failure.
      render: shell

  - type: input
    id: file-details
    attributes:
      label: File details (if a specific file is involved)
      description: Extension, rough size, and where it came from. Do not attach private files.
      placeholder: .MTS, ~90 MB, Sony camcorder
